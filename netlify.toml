[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/polymarket"
  to = "/.netlify/functions/polymarket"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
